[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "glint-geo"
version = "0.1.2"
description = "Reproducible public ZTF streak photometry for catalogued GEO objects"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "Yusuf Enes Korkmaz", email = "yusufeneskorkmaz@outlook.com"}]
dependencies = [
  "astropy>=6.0",
  "httpx>=0.27",
  "matplotlib>=3.8",
  "numpy>=1.26",
  "scipy>=1.12",
  "skyfield>=1.49",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
glint-geo = "glint_geo.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: requires public network services and user credentials; skipped by default"]
